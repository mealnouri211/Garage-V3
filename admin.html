<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>هيرو ووركس</title>
  <meta name="description" content="هيرو ووركس – مركز العناية بالسيارات في الكويت">
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var t=JSON.parse(localStorage.getItem('hw_theme'))||'dark';t=t==='light'?'light':'dark';document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#faf8f3':'#0a0a0b'}catch(e){document.documentElement.dataset.theme='dark'}})();</script>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo-192.png">
  <script>/* admin always loads fresh copies of its files, so a cached old file can never be mixed with the new page */
    window.__v = Date.now(); ['styles.css', 'admin.css'].forEach(function (f) { document.write('<link rel="stylesheet" href="' + f + '?v=' + window.__v + '">'); });</script>
</head>
<body data-page="admin" data-title="a_title">
  <div id="adminLayer" class="adminlayer"><header class="adminbar" id="adminBar"></header><main class="container container--wide adminroot" id="adminRoot"></main><div id="printSheet" class="print-sheet"></div></div>
  <script>window.addEventListener('unhandledrejection',function(e){window.dispatchEvent(new ErrorEvent('error',{message:String(e.reason&&e.reason.message||e.reason)}))});setTimeout(function(){var r=document.getElementById('adminRoot');if(r&&!r.children.length&&!document.getElementById('adminErr')){document.body.insertAdjacentHTML('beforeend','<pre id="adminErr" style="position:fixed;inset:auto 0 0 0;margin:0;padding:1rem;background:#300;color:#fff;font:14px/1.6 sans-serif;white-space:pre-wrap;z-index:999">The admin page did not start. Replace js/admin.js, js/common.js, js/store.js, js/i18n-v2.js, admin.html and admin.css with the newest versions, then reload.</pre>')}},4000);window.addEventListener('error',function(e){var d=document.getElementById('adminErr')||document.body.appendChild(Object.assign(document.createElement('pre'),{id:'adminErr'}));d.style.cssText='position:fixed;inset:auto 0 0 0;margin:0;padding:1rem;background:#300;color:#fff;font:13px/1.5 monospace;white-space:pre-wrap;z-index:999';d.textContent+=(e.message||'error')+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')\n'})</script>
  <script>['js/data.js', 'js/config.js', 'js/vehicles.js', 'js/pricing.js', 'js/store.js', 'js/i18n-v2.js', 'js/common.js', 'js/carpicker.js', 'js/admin.js'].forEach(function (f) { document.write('<script src="' + f + '?v=' + window.__v + '"><\/script>'); });</script>
</body>
</html>
